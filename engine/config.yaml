server:
  port: 9000

levels:
  class-1-3: 'Class 1 to 3: use very short sentences and everyday words, explain one idea at a time with a familiar example, keep it under 100 words.'
  class-4-5: 'Class 4 to 5: use simple words and short paragraphs, explain each new term, give one worked example.'
  class-6-8: 'Class 6 to 8: reason step by step, introduce correct terms with plain definitions, give one example and one check question.'
  class-9-12: 'Class 9 to 12: use textbook-accurate terms and formulas, show full steps, point out common mistakes, add an exam tip.'
  undergraduate: 'Undergraduate: explain rigorously with derivations, state assumptions, point to standard texts.'
  postgraduate: 'Postgraduate: write concisely for an expert, cover advanced theory and edge cases, flag uncertainty clearly.'

grades:
  class-1-3: 4
  class-4-5: 6
  class-6-8: 9
  class-9-12: 13
  undergraduate: 18
  postgraduate: 30

components:
  llm:
    enabled: true
    base_url: http://infer:8000/v1
    chat_model: chat
    free_model: free
    embedding_model: embedding
  retriever:
    enabled: true
    url: http://qdrant:6333
    collection: textbooks
    top_k: 5
    min_score: 0.45
  websearch:
    enabled: true
    url: http://searxng:8080/search
    max_pages: 2
  imagegen:
    enabled: true
    url: http://comfyui:8188
    workflow: /app/workflows/flux-schnell.json
    prompt_node: '41'
    seed_node: '31'
    seed_field: seed
  verifier:
    enabled: true
    max_rounds: 1
    samples: 0

