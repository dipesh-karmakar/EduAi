# Description: Defines the EduAI services and their local data/model mounts.
# Author: Dipesh Karmakar <dipesh.karmakar@gmail.com>
# Modifications:
# - f9dc837: Added the initial multi-service application setup.
# - 130fab8: Added inference and image-generation services.
# - a25ef17: Added the initial project deployment configuration.

name: eduai

services:
  # Supporting services provide search, vector storage, and the browser UI.
  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ../searxng:/etc/searxng
    ports:
      - 127.0.0.1:8888:8080

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - ../data/qdrant:/qdrant/storage
    ports:
      - 127.0.0.1:6333:6333

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    command: ["/bin/bash", "/app/custom-start.sh"]
    ports:
      - 3000:8080
    volumes:
      - ../data/openwebui:/app/backend/data
      - ../openwebui/custom-start.sh:/app/custom-start.sh:ro
      - ../logo/logo.png:/app/build/static/favicon.png:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - ENABLE_OLLAMA_API=false
      - WEBUI_NAME=Pablo1.9.8.2
      - OPENAI_API_KEY=sk-local
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_PERSISTENT_CONFIG=false
      - OPENAI_API_BASE_URL=http://engine:9000/v1

  # GPU-backed model and image services; model and output files persist on the host.
  infer:
    build: ../infer
    container_name: infer
    restart: unless-stopped
    gpus: all
    volumes:
      - ../infer:/app/infer:ro
      - ../models:/app/models:ro
    ports:
      - 127.0.0.1:8000:8000

  comfyui:
    build: ../comfyUI
    container_name: comfyui
    restart: unless-stopped
    gpus: all
    volumes:
      - ../models/comfyui:/app/models
      - ../data/comfyui-output:/app/output
    ports:
      - 127.0.0.1:8188:8188

  # Public API orchestrates the model and supporting services on the Compose network.
  engine:
    build: ../engine
    container_name: engine
    restart: unless-stopped
    volumes:
      - ../engine:/app
      - ../workflows:/app/workflows:ro
    ports:
      - 127.0.0.1:9000:9000
    depends_on:
      - infer
      - qdrant
      - searxng
      - comfyui

